name: Recipe Planner Backend CI

on: push

env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

defaults:
  run:
    working-directory: 07-ci-cd-pipeline-and-deployment-environment/recipe-planner-backend

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn $MAVEN_CLI_OPTS compile

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn $MAVEN_CLI_OPTS test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: 07-ci-cd-pipeline-and-deployment-environment/recipe-planner-backend/target/site/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4